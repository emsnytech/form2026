name: Signaler une erreur dans une réponse
description: Une réponse de « Où faire sa démarche ? » (version avec assistant) qui oriente mal ou cite une démarche qui ne convient pas.
title: "Erreur dans une réponse : "
labels: ["erreur-reponse"]
body:
  - type: markdown
    attributes:
      value: |
        Merci. **Vérifiez qu'aucune donnée personnelle ne figure ci-dessous** (nom, numéro de dossier, adresse, téléphone, santé) : la question est publique une fois envoyée.
  - type: textarea
    id: question
    attributes:
      label: Question posée
      description: Recopiée par la page, après retrait des données personnelles reconnues.
  - type: input
    id: references
    attributes:
      label: Démarches citées dans la réponse
      description: Références du répertoire (DN-…, SP-…), recopiées par la page.
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui ne va pas
    validations:
      required: true
