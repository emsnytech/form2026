name: Alerte de déploiement

# Après chaque fusion sur main (le contrôle suit le déploiement jusqu'à sa fin), et chaque matin :
# le site en ligne correspond-il à main ? Sinon, une issue est ouverte, une seule tant qu'elle reste ouverte.
# Le déclencheur workflow_run sur « pages build and deployment » n'a jamais réagi (constaté le 08/11/2026) :
# il est remplacé par push.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: alerte-deploiement
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pages: read

jobs:
  deploiement:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Le site en ligne correspond à main
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verifier_deploiement.py ${{ github.event_name == 'push' && '--attendre' || '' }}

      - name: Ouvrir une issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITRE="Le site en ligne n'est pas à jour"
          if gh issue list --state open --search "in:title \"$TITRE\"" --json number -q '.[0].number' | grep -q .; then
            echo "Issue déjà ouverte."
            exit 0
          fi
          gh issue create --title "$TITRE" \
            --body "Le dernier déploiement de GitHub Pages a échoué, ou main n'est pas en ligne. Détail : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Relancer le déploiement depuis l'onglet Actions, puis fermer cette issue."
